<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="helmetGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:0.7" />
    </radialGradient>
    <linearGradient id="suitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Space Background -->
  <circle cx="200" cy="200" r="200" fill="url(#spaceGradient)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="80" r="1.5" fill="#fdcb6e" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="120" r="1" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="300" r="1.2" fill="#fd79a8" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="350" r="0.8" fill="#6c5ce7" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Distant Planet -->
  <circle cx="320" cy="100" r="25" fill="#fd79a8" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 320 100;360 320 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Astronaut Body -->
  <ellipse cx="200" cy="280" rx="45" ry="60" fill="url(#suitGradient)" stroke="#adb5bd" stroke-width="2"/>
  
  <!-- Astronaut Arms -->
  <ellipse cx="160" cy="250" rx="15" ry="35" fill="url(#suitGradient)" stroke="#adb5bd" stroke-width="1.5" transform="rotate(-20 160 250)"/>
  <ellipse cx="240" cy="250" rx="15" ry="35" fill="url(#suitGradient)" stroke="#adb5bd" stroke-width="1.5" transform="rotate(20 240 250)"/>
  
  <!-- Astronaut Legs -->
  <ellipse cx="185" cy="340" rx="12" ry="30" fill="url(#suitGradient)" stroke="#adb5bd" stroke-width="1.5"/>
  <ellipse cx="215" cy="340" rx="12" ry="30" fill="url(#suitGradient)" stroke="#adb5bd" stroke-width="1.5"/>
  
  <!-- Helmet -->
  <circle cx="200" cy="180" r="50" fill="url(#helmetGradient)" stroke="#4a90e2" stroke-width="3" opacity="0.9"/>
  
  <!-- Helmet Reflection -->
  <ellipse cx="185" cy="165" rx="15" ry="20" fill="#ffffff" opacity="0.6"/>
  
  <!-- Astronaut Face (simplified) -->
  <circle cx="190" cy="175" r="2" fill="#2d3436"/>
  <circle cx="210" cy="175" r="2" fill="#2d3436"/>
  <path d="M 190 190 Q 200 195 210 190" stroke="#2d3436" stroke-width="1.5" fill="none"/>
  
  <!-- Chest Control Panel -->
  <rect x="185" y="260" width="30" height="20" rx="5" fill="#4a90e2" opacity="0.8"/>
  <circle cx="195" cy="270" r="2" fill="#ff6b6b"/>
  <circle cx="205" cy="270" r="2" fill="#00b894"/>
  
  <!-- Floating Particles around Astronaut -->
  <circle cx="120" cy="200" r="2" fill="#fdcb6e" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0;10,-5;0,0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="220" r="1.5" fill="#6c5ce7" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0;-8,3;0,0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="320" r="1" fill="#0984e3" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0;5,8;0,0" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Jetpack Flames -->
  <ellipse cx="200" cy="350" rx="8" ry="15" fill="#ff6b6b" opacity="0.8">
    <animate attributeName="ry" values="15;20;15" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="200" cy="355" rx="5" ry="10" fill="#fdcb6e" opacity="0.9">
    <animate attributeName="ry" values="10;15;10" dur="0.3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
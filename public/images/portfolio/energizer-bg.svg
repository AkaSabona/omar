<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="energizerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD23F;stop-opacity:1" />
    </linearGradient>
    <pattern id="energizerPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#energizerGrad)"/>
  <rect width="800" height="600" fill="url(#energizerPattern)"/>
  
  <!-- Battery Icon -->
  <g transform="translate(300, 200)">
    <!-- Battery Body -->
    <rect x="0" y="50" width="180" height="100" rx="10" fill="rgba(255,255,255,0.9)" stroke="#333" stroke-width="3"/>
    <!-- Battery Terminal -->
    <rect x="180" y="75" width="20" height="50" rx="5" fill="rgba(255,255,255,0.9)" stroke="#333" stroke-width="3"/>
    <!-- Energy Bars -->
    <rect x="20" y="70" width="25" height="60" rx="3" fill="#FF6B35"/>
    <rect x="55" y="70" width="25" height="60" rx="3" fill="#F7931E"/>
    <rect x="90" y="70" width="25" height="60" rx="3" fill="#FFD23F"/>
    <rect x="125" y="70" width="25" height="60" rx="3" fill="#4CAF50"/>
  </g>
  
  <!-- Lightning Bolts -->
  <g transform="translate(150, 100)">
    <path d="M0 0 L20 0 L10 30 L25 30 L5 60 L15 30 L0 30 Z" fill="rgba(255,255,255,0.8)"/>
  </g>
  <g transform="translate(600, 150)">
    <path d="M0 0 L15 0 L8 20 L18 20 L3 40 L10 20 L0 20 Z" fill="rgba(255,255,255,0.6)"/>
  </g>
  
  <!-- Brand Text -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="rgba(255,255,255,0.9)">ENERGIZER</text>
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">Dynamic Content Strategy</text>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="500" r="30" fill="rgba(255,255,255,0.2)"/>
  <circle cx="700" cy="100" r="40" fill="rgba(255,255,255,0.15)"/>
  <circle cx="650" cy="450" r="25" fill="rgba(255,255,255,0.25)"/>
</svg>